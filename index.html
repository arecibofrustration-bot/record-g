<!-- captcha.html -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verify You're Human</title>
<style>
  :root {
    --bg-color: #1f1f1f;
    --card-bg: #000000;
    --text-primary: #e3e3e3;
    --text-secondary: #c4c7c5;
    --text-link: #a8c7fa;
    --border-color: #5f6368;
    --border-focus: #a8c7fa;
    --error-color: #f28b82;
    --btn-bg: #a8c7fa;
    --btn-text: #001d35;
    --btn-hover: #d3e3fd;
    --font-family: "Google Sans", "Roboto", Arial, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background-color: var(--bg-color);
    color: var(--text-primary);
    font-family: var(--font-family);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    position: relative;
    overflow-x: hidden;
  }

  .card {
    background-color: var(--card-bg);
    border-radius: 28px;
    padding: 40px 36px;
    max-width: 450px;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    min-height: 400px;
    justify-content: center;
  }

  .google-logo {
    width: 40px;
    height: 40px;
    margin-bottom: 20px;
  }

  h1 {
    font-size: 28px;
    font-weight: 400;
    letter-spacing: -0.5px;
    margin-bottom: 12px;
    color: var(--text-primary);
  }

  p {
    font-size: 15px;
    color: var(--text-secondary);
    margin-bottom: 28px;
    line-height: 1.5;
  }

  .captcha-wrap {
    display: flex;
    justify-content: center;
    margin-bottom: 20px;
    width: 100%;
  }

  /* reCAPTCHA renders in a light iframe; nothing we can theme inside it,
     so give it breathing room. */
  .captcha-wrap > div { min-height: 78px; }

  #status {
    font-size: 14px;
    min-height: 22px;
    margin-top: 8px;
    color: var(--text-secondary);
    line-height: 1.5;
  }
  #status.error { color: var(--error-color); }
  #status.loading { color: var(--text-link); }

  /* Simple spinner shown while status is .loading */
  #status.loading::before {
    content: "";
    display: inline-block;
    width: 12px;
    height: 12px;
    margin-right: 8px;
    border: 2px solid rgba(168, 199, 250, 0.35);
    border-top-color: var(--border-focus);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    vertical-align: -2px;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  @media (max-width: 480px) {
    .card {
      border-radius: 24px;
      padding: 32px 24px;
      min-height: auto;
    }
    h1 { font-size: 24px; }
  }
</style>
</head>
<body>

  <div class="card">
    <svg class="google-logo" viewBox="0 0 48 48">
      <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"></path>
      <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"></path>
      <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"></path>
      <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"></path>
    </svg>

    <h1>Verify you're human</h1>
    <p>To help keep your account safe, please complete the check below.</p>

    <div class="captcha-wrap">
      <div class="g-recaptcha"
           data-sitekey="6LdT0CkuAAAAAGxdstfySPmYyoMN3CUju47xGbPM"
           data-callback="onCaptchaSuccess"
           data-error-callback="onCaptchaError"
           data-expired-callback="onCaptchaExpired"
           data-theme="dark">
      </div>
    </div>

    <div id="status"></div>
  </div>

  <script src="https://www.google.com/recaptcha/api.js" async defer></script>
  <script>
    const statusEl = document.getElementById('status');

    async function onCaptchaSuccess(token) {
      statusEl.textContent = 'Verifying...';
      statusEl.className = 'loading';

      try {
        const res = await fetch('/api/verify', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token })
        });

        if (res.ok) {
          statusEl.textContent = 'Success! Redirecting...';
          statusEl.className = '';
          window.location.href = '/login.html';
        } else {
          const data = await res.json().catch(() => ({}));
          statusEl.textContent = data.error || 'Verification failed. Please try again.';
          statusEl.className = 'error';
          if (window.grecaptcha) grecaptcha.reset();
        }
      } catch (err) {
        statusEl.textContent = 'Something went wrong. Please try again.';
        statusEl.className = 'error';
        if (window.grecaptcha) grecaptcha.reset();
      }
    }

    function onCaptchaError() {
      statusEl.textContent = 'CAPTCHA failed to load. Check your connection.';
      statusEl.className = 'error';
    }

    function onCaptchaExpired() {
      statusEl.textContent = 'CAPTCHA expired. Please try again.';
      statusEl.className = 'error';
    }
  </script>

</body>
</html>
