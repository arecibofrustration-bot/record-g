<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verify You're Human</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0f172a;
    color: #e2e8f0;
    padding: 20px;
  }
  .card {
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 12px;
    padding: 40px 32px;
    max-width: 400px;
    width: 100%;
    text-align: center;
  }
  h1 {
    font-size: 20px;
    margin-bottom: 8px;
  }
  p {
    font-size: 14px;
    color: #94a3b8;
    margin-bottom: 24px;
  }
  .captcha-wrap {
    display: flex;
    justify-content: center;
    margin-bottom: 20px;
  }
  #status {
    font-size: 13px;
    min-height: 20px;
    margin-top: 12px;
  }
  #status.error { color: #f87171; }
  #status.loading { color: #60a5fa; }
</style>
</head>
<body>

  <div class="card">
    <h1>Quick check before you continue</h1>
    <p>Please verify you're human to access the page.</p>

    <div class="captcha-wrap">
      <div class="g-recaptcha"
           data-sitekey="6LdT0CkuAAAAAGxdstfySPmYyoMN3CUju47xGbPM"
           data-callback="onCaptchaSuccess"
           data-error-callback="onCaptchaError"
           data-expired-callback="onCaptchaExpired">
      </div>
    </div>

    <div id="status"></div>
  </div>

  <script src="https://www.google.com/recaptcha/api.js" async defer></script>
  <script>
    const statusEl = document.getElementById('status');

    async function onCaptchaSuccess(token) {
      statusEl.textContent = 'Verifying...';
      statusEl.className = 'loading';

      try {
        const res = await fetch('/api/verify', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token })
        });

        if (res.ok) {
          statusEl.textContent = 'Success! Redirecting...';
          statusEl.className = '';
          window.location.href = '/protected.html';
        } else {
          const data = await res.json().catch(() => ({}));
          statusEl.textContent = data.error || 'Verification failed. Please try again.';
          statusEl.className = 'error';
          if (window.grecaptcha) grecaptcha.reset();
        }
      } catch (err) {
        statusEl.textContent = 'Something went wrong. Please try again.';
        statusEl.className = 'error';
        if (window.grecaptcha) grecaptcha.reset();
      }
    }

    function onCaptchaError() {
      statusEl.textContent = 'CAPTCHA failed to load. Check your connection.';
      statusEl.className = 'error';
    }

    function onCaptchaExpired() {
      statusEl.textContent = 'CAPTCHA expired. Please try again.';
      statusEl.className = 'error';
    }
  </script>

</body>
</html>
